# Production : frontend (Nginx) + API Express + PostgreSQL
#
# Fichier .env : le répertoire projet par défaut est deployment/ → Compose charge deployment/.env.
# Pour la racine du clone, utiliser --env-file (et PAS --project-directory sur la racine, sinon context: .. casse) :
#   docker compose --env-file ./.env -f deployment/docker-compose.prod.yml up --build -d
#
# Requises : POSTGRES_PASSWORD. Optionnel : VITE_RECAPTCHA_SITE_KEY (défaut dans ce fichier si vide),
# RECAPTCHA_SECRET_KEY (API, login admin).
#
# Reverse proxy Nginx (hôte) suggéré :
#   tp-vuejs.aanc.fr      -> 127.0.0.1:8010 (web)
#   api.tp-vuejs.aanc.fr -> 127.0.0.1:8011 (api)
#
# Fichier relatif au dossier deployment/ : contextes ../ et ../api pointent vers la racine du dépôt.

name: tp-vuejs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tpvuejs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tpvuejs}
    volumes:
      - tp_vuejs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tpvuejs -d tpvuejs || exit 1']
      interval: 5s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-tpvuejs}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tpvuejs}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:8011:3000'
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
      args:
        VITE_API_URL: https://api.tp-vuejs.aanc.fr
        # Clé publique reCAPTCHA v3 (non secrète) : défaut pour CI / déploiement sans .env ; surcharger via l’environnement si besoin.
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-6LckP6MsAAAAABOf5NilEJwwcrCq-LiOIQqxq_Y9}
    ports:
      - '8010:80'
    restart: unless-stopped

volumes:
  tp_vuejs_pgdata:
