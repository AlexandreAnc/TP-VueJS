name: Déploiement Docker (SSH distant)

on:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      APP_DIR: ${{ secrets.APP_DIR }}
      REPO_URL: https://github.com/${{ github.repository }}.git
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Installer sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Déployer sur la machine distante
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << EOF
            set -e

            TARGET_DIR="\${APP_DIR:-\$HOME/tp-vuejs}"

            if [ ! -d "\$TARGET_DIR/.git" ]; then
              rm -rf "\$TARGET_DIR"
              git clone "$REPO_URL" "\$TARGET_DIR"
            else
              git -C "\$TARGET_DIR" fetch --all
              git -C "\$TARGET_DIR" reset --hard "origin/${{ github.ref_name }}"
            fi

            cd "\$TARGET_DIR"

            export POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
            export POSTGRES_USER="\${POSTGRES_USER:-tpvuejs}"
            export POSTGRES_DB="\${POSTGRES_DB:-tpvuejs}"

            docker stop tp-vuejs 2>/dev/null || true
            docker rm tp-vuejs 2>/dev/null || true

            # Compose v2 : commande « docker compose » (plugin). Sur Debian vanilla le paquet
            # docker-compose-plugin n’est que dans le dépôt Docker officiel — sinon on installe
            # le binaire plugin dans ~/.docker/cli-plugins/ (documentation Docker).
            COMPOSE_FILE=deployment/docker-compose.prod.yml
            if ! docker compose version >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                :
              else
                ARCH="\$(uname -m)"
                case "\$ARCH" in
                  x86_64) DC_ARCH=x86_64 ;;
                  aarch64) DC_ARCH=aarch64 ;;
                  *)
                    echo "Architecture Docker Compose non gérée: \$ARCH (prévoir docker compose ou docker-compose)"
                    exit 1
                    ;;
                esac
                mkdir -p "\$HOME/.docker/cli-plugins"
                curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-\${DC_ARCH}" -o "\$HOME/.docker/cli-plugins/docker-compose"
                chmod +x "\$HOME/.docker/cli-plugins/docker-compose"
              fi
            fi

            if docker compose version >/dev/null 2>&1; then
              docker compose -f "\$COMPOSE_FILE" down --remove-orphans || true
            else
              docker-compose -f "\$COMPOSE_FILE" down --remove-orphans || true
            fi

            # Libère de la place avant rebuild (souvent la cause de « no space left on device » sur petit VPS)
            docker builder prune -af || true
            docker image prune -af || true

            if docker compose version >/dev/null 2>&1; then
              docker compose -f "\$COMPOSE_FILE" up -d --build
            else
              docker-compose -f "\$COMPOSE_FILE" up -d --build
            fi

            docker image prune -f || true
          EOF
