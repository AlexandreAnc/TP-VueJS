name: CI Production (Tests + Coverage)

on:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Check "All files" coverage >= 80%
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const path = 'coverage/coverage-summary.json'
          if (!fs.existsSync(path)) {
            console.error(`Coverage summary not found: ${path}`)
            process.exit(1)
          }
          const summary = JSON.parse(fs.readFileSync(path, 'utf8'))
          const totals = summary.total || {}
          const lines = totals.lines?.pct ?? 0
          const statements = totals.statements?.pct ?? 0
          console.log(`All files - lines: ${lines}%`)
          console.log(`All files - statements: ${statements}%`)
          if (lines < 80 || statements < 80) {
            console.error('Coverage gate failed: "All files" must be >= 80% (lines and statements).')
            process.exit(1)
          }
          EOF
