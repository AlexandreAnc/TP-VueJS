name: CI et déploiement production

on:
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  test-and-coverage:
    name: Tests et couverture (lignes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Le front (racine) et l’API sont deux projets pnpm distincts : Vitest importe api/src/*.mjs
      # et doit résoudre cors, express, pg depuis api/node_modules.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile --dir api

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Gate couverture — lignes « All files » ≥ 70 %
        run: |
          node <<'EOF'
          const fs = require('node:fs')
          const path = 'coverage/coverage-summary.json'
          if (!fs.existsSync(path)) {
            console.error(`Résumé de couverture introuvable : ${path}`)
            process.exit(1)
          }
          const summary = JSON.parse(fs.readFileSync(path, 'utf8'))
          const totals = summary.total || {}
          const lines = totals.lines?.pct ?? 0
          const minLines = 70
          console.log(`All files — lignes : ${lines}% (minimum ${minLines}%)`)
          if (lines < minLines) {
            console.error(`CI bloquée : la couverture en lignes doit être ≥ ${minLines}% (tous fichiers).`)
            process.exit(1)
          }
          EOF

  deploy:
    name: Déploiement Docker (SSH)
    needs: test-and-coverage
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      APP_DIR: ${{ secrets.APP_DIR }}
      REPO_URL: https://github.com/${{ github.repository }}.git
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - name: Installer sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Déployer sur la machine distante
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << EOF
            set -e

            TARGET_DIR="\${APP_DIR:-\$HOME/tp-vuejs}"

            if [ ! -d "\$TARGET_DIR/.git" ]; then
              rm -rf "\$TARGET_DIR"
              git clone "$REPO_URL" "\$TARGET_DIR"
            else
              git -C "\$TARGET_DIR" fetch --all
              git -C "\$TARGET_DIR" reset --hard "origin/${{ github.ref_name }}"
            fi

            cd "\$TARGET_DIR"

            export POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
            export POSTGRES_USER="\${POSTGRES_USER:-tpvuejs}"
            export POSTGRES_DB="\${POSTGRES_DB:-tpvuejs}"

            docker stop tp-vuejs 2>/dev/null || true
            docker rm tp-vuejs 2>/dev/null || true

            # Compose v2 : commande « docker compose » (plugin). Sur Debian vanilla le paquet
            # docker-compose-plugin n’est que dans le dépôt Docker officiel — sinon on installe
            # le binaire plugin dans ~/.docker/cli-plugins/ (documentation Docker).
            COMPOSE_FILE=deployment/docker-compose.prod.yml
            # Ne pas utiliser --project-directory sur la racine : Compose résout alors context: .. depuis la racine
            # (chemins cassés → « lstat .../deployment: no such file »). --env-file charge le .env racine pour l’interpolation.
            if [ -f ./.env ]; then
              COMPOSE_ENV=(--env-file ./.env)
            else
              COMPOSE_ENV=()
            fi
            COMPOSE_ARGS=("\${COMPOSE_ENV[@]}" -f "\$COMPOSE_FILE")
            if ! docker compose version >/dev/null 2>&1; then
              if command -v docker-compose >/dev/null 2>&1; then
                :
              else
                ARCH="\$(uname -m)"
                case "\$ARCH" in
                  x86_64) DC_ARCH=x86_64 ;;
                  aarch64) DC_ARCH=aarch64 ;;
                  *)
                    echo "Architecture Docker Compose non gérée: \$ARCH (prévoir docker compose ou docker-compose)"
                    exit 1
                    ;;
                esac
                mkdir -p "\$HOME/.docker/cli-plugins"
                curl -fsSL "https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-\${DC_ARCH}" -o "\$HOME/.docker/cli-plugins/docker-compose"
                chmod +x "\$HOME/.docker/cli-plugins/docker-compose"
              fi
            fi

            if docker compose version >/dev/null 2>&1; then
              docker compose "\${COMPOSE_ARGS[@]}" down --remove-orphans || true
            else
              docker-compose "\${COMPOSE_ENV[@]}" -f "\$COMPOSE_FILE" down --remove-orphans || true
            fi

            # Pas de « prune -af » ici : ça supprime tout le cache build + les images non utilisées → re-télécharge
            # postgres à chaque push. En cas de disque plein, lancer une fois à la main sur le VPS :
            #   docker builder prune -af && docker image prune -af

            if docker compose version >/dev/null 2>&1; then
              docker compose "\${COMPOSE_ARGS[@]}" up -d --build
            else
              docker-compose "\${COMPOSE_ENV[@]}" -f "\$COMPOSE_FILE" up -d --build
            fi

            docker image prune -f || true
          EOF
